name: Project validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate JSON Schemas and fixtures
        run: python scripts/validate_schemas.py

      - name: Run Phase 0 synthetic ingestion gate
        run: python scripts/check_phase0_gate.py

      - name: Run runtime epistemic projection leakage test
        run: python scripts/test_runtime_projection.py

      - name: Run Phase 1 historical catalog gate
        run: python scripts/check_phase1_catalog.py

      - name: Run epigram crosswalk gate
        run: python scripts/check_epigram_crosswalk.py

      - name: Run epigram migration-plan gate
        run: python scripts/check_epigram_migration_plan.py

      - name: Run work-code registry gate
        run: python scripts/check_work_registry.py

      - name: Run authenticity assertion gate
        run: python scripts/check_authenticity_assertions.py

      - name: Run authenticity coverage gate
        run: python scripts/check_authenticity_coverage.py
