name: Phase 0 validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate JSON Schemas and fixtures
        run: python scripts/validate_schemas.py

      - name: Run Phase 0 synthetic ingestion gate
        run: python scripts/check_phase0_gate.py

      - name: Run runtime epistemic projection leakage test
        run: python scripts/test_runtime_projection.py
